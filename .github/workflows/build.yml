name: build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Common configure flags for IDA's Bochs debugger integration.
  # --enable-debugger is required: IDA communicates with Bochs through its
  # internal debugger interface.
  BOCHS_CONFIGURE_COMMON: >-
    --enable-static-link
    --with-nogui
    --enable-debugger
    --disable-debugger-gui
    --enable-disasm
    --enable-x86-64
    --enable-pci
    --enable-cpu-level=6
    --enable-a20-pin
    --enable-fpu
    --enable-large-ramfile
    --disable-readline
    --enable-show-ips
    --enable-logging
    --enable-usb
    --enable-usb-ohci
    --enable-clgd54xx
    --enable-avx
    --disable-docbook
  STUB_DLLS: >-
    ntdll kernel32 user32 shell32 shlwapi urlmon advapi32 mswsock wininet
    msvcrt gdi32 ole32 wsock32 ws2_32
    comctl32 comdlg32 oleaut32 version rpcrt4 secur32 crypt32 wintrust
    winhttp iphlpapi setupapi userenv psapi imm32 kernelbase normaliz
    sechost netapi32 mpr
    bcrypt ncrypt dbghelp imagehlp wtsapi32 samlib authz credui sfc sfc_os
    amsi wer dnsapi dhcpcsvc fwpuclnt httpapi cabinet
    ucrtbase vcruntime140 msvcp140 msvcr120 msvcp120 msvcr110 msvcp110
    msvcr100 msvcp100 msvcr90 msvcp90 msvcr80 msvcp80 msvcr71 msvcp71
    msvcp60 msvcirt msvcrt20
    oleacc oledlg propsys combase comsvcs mscoree wbemprox wbemdisp
    wmiutils activeds ntdsapi
    uxtheme shcore dwmapi winmm msimg32 powrprof apphelp sxs cfgmgr32
    wevtapi pdh msi wldap32 odbc32 msacm32 riched20 msftedit cryptnet
    cryptui cryptsp snmpapi nsi rasapi32 taskschd rstrtmgr dbgeng tdh
    d3d9 d3d11 dxgi d2d1 dwrite dsound opengl32 dinput xinput1_3

jobs:
  build-bochs:
    name: Bochs (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: windows-latest
            platform: windows-x86_64
            msystem: MINGW64
            msys2_packages: mingw-w64-x86_64-gcc
          - os: windows-11-arm
            platform: windows-aarch64
            msystem: CLANGARM64
            msys2_packages: mingw-w64-clang-aarch64-cc
          - os: macos-latest
            platform: macos-aarch64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.msys2_packages }}
            make
            diffutils
            flex
            bison

      - name: Configure and build (Linux)
        if: runner.os == 'Linux'
        working-directory: vendor/bochs/bochs
        shell: bash
        run: |
          ./configure \
            --prefix="${{ github.workspace }}/bochs-install" \
            $BOCHS_CONFIGURE_COMMON
          make -j$(nproc)
          make install

      - name: Configure and build (macOS)
        if: runner.os == 'macOS'
        working-directory: vendor/bochs/bochs
        shell: bash
        run: |
          ./configure \
            --prefix="${{ github.workspace }}/bochs-install" \
            $BOCHS_CONFIGURE_COMMON
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Configure and build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd vendor/bochs/bochs
          ./configure \
            --prefix="$(cygpath -u '${{ github.workspace }}')/bochs-install" \
            $BOCHS_CONFIGURE_COMMON
          make -j$(nproc)
          make install

      - name: Verify Bochs binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./bochs-install/bin/bochs --help

      - name: Verify Bochs binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./bochs-install/bin/bochs.exe --help

      - name: Collect artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "artifacts/bin" "artifacts/share/bochs"
          cp "bochs-install/bin/bochs" "artifacts/bin/"
          cp "bochs-install/share/bochs/BIOS-bochs-latest" "artifacts/share/bochs/"
          cp "bochs-install/share/bochs/VGABIOS-lgpl-latest" "artifacts/share/bochs/"

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "artifacts"
          # IDA expects "bochsdbg.exe" on Windows, not "bochs.exe"
          cp "bochs-install/bin/bochs.exe" "artifacts/bochsdbg.exe"
          cp "bochs-install/share/bochs/BIOS-bochs-latest" "artifacts/"
          cp "bochs-install/share/bochs/VGABIOS-lgpl-latest" "artifacts/"

      - name: Upload Bochs artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bochs-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  generate-stubs:
    name: Windows DLL stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Generate stub DLLs
        run: uv run --with lief scripts/generate_stubs.py

      - name: Upload 32-bit stub artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-stubs-x86
          path: data/stubs/windows/*.dll
          if-no-files-found: error

      - name: Upload 64-bit stub artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-stubs-x64
          path: data/stubs/windows64/*.dll
          if-no-files-found: error

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run tests
        run: uv run --with lief --with pytest pytest tests/ -v

  package:
    name: Package plugin
    needs: [build-bochs, generate-stubs, unit-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble plugin archive
        shell: bash
        run: |
          mkdir -p stage

          cp ida-plugin._.json stage/ida-plugin.json
          cp bochs_binaries_entry.py stage/

          # Bochs binaries — each platform in its own subdirectory
          for artifact_dir in artifacts/bochs-*/; do
            platform=$(basename "$artifact_dir" | sed 's/^bochs-//')
            mkdir -p "stage/bochs/${platform}"
            cp -r "${artifact_dir}"* "stage/bochs/${platform}/"
          done

          find stage/bochs -path '*/bin/bochs' -type f -exec chmod +x {} +

          # Windows DLL stubs (32-bit and 64-bit)
          mkdir -p stage/data/stubs/windows stage/data/stubs/windows64
          cp artifacts/win-stubs-x86/*.dll stage/data/stubs/windows/
          cp artifacts/win-stubs-x64/*.dll stage/data/stubs/windows64/

          # Build the archive
          cd stage
          zip -r ../ida-bochs-binaries.zip *

      - name: Lint plugin
        run: uv run --with ida-hcli hcli --disable-updates plugin lint stage/

      - name: Upload plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: ida-bochs-binaries
          path: ida-bochs-binaries.zip
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ida-bochs-binaries.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test (${{ matrix.name }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            idapyswitch: "/idapyswitch"
            venv_python: "bin/python3"
          - name: Linux ARM
            os: ubuntu-24.04-arm
            idapyswitch: "/idapyswitch"
            venv_python: "bin/python3"
          - name: Windows
            os: windows-latest
            idapyswitch: "/idapyswitch.exe"
            venv_python: "Scripts/python.exe"
          # IDA 9.4 does not ship the bochs debugger plugin for ARM64 Windows.
          # Re-enable when a future IDA release includes plugins/bochs/bochsys.dll.
          # - name: Windows ARM
          #   os: windows-11-arm
          #   idapyswitch: "/idapyswitch.exe"
          #   venv_python: "Scripts/python.exe"
          - name: macOS
            os: macos-latest
            idapyswitch: "/Contents/MacOS/idapyswitch"
            venv_python: "bin/python3"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      - name: Download plugin archive
        uses: actions/download-artifact@v4
        with:
          name: ida-bochs-binaries

      - name: Install IDA
        shell: bash
        run: |
          uv run --with ida-hcli hcli --disable-updates \
            ida install \
            --download-id "ida-pro:9.4" \
            --license-id "$IDA_LICENSE_ID" \
            --install-dir="${{ runner.temp }}/app/ida" \
            --accept-eula \
            --set-default \
            --yes
        env:
          HCLI_API_KEY: ${{ secrets.HCLI_API_KEY }}
          IDA_LICENSE_ID: ${{ secrets.IDA_LICENSE_ID }}

      - name: Create venv for IDA
        shell: bash
        run: uv venv "$HOME/.idapro/venv"

      - name: Register Python interpreter with IDA
        shell: bash
        run: |
          "${{ runner.temp }}/app/ida${{ matrix.idapyswitch }}" \
            --force-path $( \
              "$HOME/.idapro/venv/${{ matrix.venv_python }}" -c \
                'import sys,sysconfig,pathlib;print(__import__("_winapi").GetModuleFileName(sys.dllhandle) if sys.platform=="win32" else next(pathlib.Path(sysconfig.get_config_var("LIBDIR")).glob("libpython*")))' \
            )

      - name: Set IDAPYTHON_VENV_EXECUTABLE
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "IDAPYTHON_VENV_EXECUTABLE=$(cygpath -w "$HOME/.idapro/venv/${{ matrix.venv_python }}")" >> "$GITHUB_ENV"
          else
            echo "IDAPYTHON_VENV_EXECUTABLE=$HOME/.idapro/venv/${{ matrix.venv_python }}" >> "$GITHUB_ENV"
          fi

      - name: Install plugin
        shell: bash
        run: uv run --with ida-hcli hcli --disable-updates plugin install ida-bochs-binaries.zip

      - name: Install idalib packages
        shell: bash
        run: uv pip install --python "$HOME/.idapro/venv/${{ matrix.venv_python }}" idapro ida-domain

      - name: Download test sample
        shell: bash
        run: |
          curl -L -o "${{ runner.temp }}/pma-lab01-01.exe_" \
            "https://raw.githubusercontent.com/mandiant/capa-testfiles/master/Practical%20Malware%20Analysis%20Lab%2001-01.exe_"

      - name: Run Bochs debugger test
        shell: bash
        run: |
          "$HOME/.idapro/venv/${{ matrix.venv_python }}" scripts/idalib-dbg-bochs.py "${{ runner.temp }}/pma-lab01-01.exe_"
